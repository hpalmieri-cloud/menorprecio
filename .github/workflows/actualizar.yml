name: Actualizar precios (manual)

# No tiene cron a propósito.
# El SEPA solo responde a conexiones argentinas: desde los runners de GitHub
# (IPs de datacenter en EE. UU.) la API y el ZIP devuelven 403 o no responden.
# La actualización diaria corre en Windows con `publicar.ps1` y el Programador
# de tareas. Este workflow queda para probar cambios del pipeline a mano en
# entornos donde la descarga sí funcione (por ejemplo, un runner self-hosted).

on:
  workflow_dispatch:

concurrency:
  group: actualizar
  cancel-in-progress: false

jobs:
  publicar:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Instalar dependencias
        run: pip install -r requirements.txt

      - name: Descargar y normalizar
        run: python pipeline/ingest.py

      - name: Clasificar productos
        run: python pipeline/productos.py

      - name: Generar sitio
        run: python pipeline/build.py

      - name: Publicar el sitio como artefacto
        uses: actions/upload-artifact@v4
        with:
          name: sitio
          path: dist
          retention-days: 7
