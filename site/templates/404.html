{% extends "base.html" %}

{% block contenido %}
<article class="contenedor" style="text-align: center; padding: 4rem 1rem;">
  <h1 style="font-size: 2.5rem; margin-bottom: 1rem;">Página no encontrada (404)</h1>
  <p style="font-size: 1.1rem; color: var(--tinta-suave); max-width: 500px; margin: 0 auto 2rem;">
    El producto, categoría o enlace que estás buscando no figura en el catálogo o no está disponible.
  </p>
  <a href="/" style="display: inline-block; padding: 0.7rem 1.5rem; background: var(--azul); color: #fff; text-decoration: none; border-radius: 8px; font-weight: 600;">
    Volver al buscador principal
  </a>
</article>
{% endblock %}
